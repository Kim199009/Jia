name: 定时报时提醒

# 北京时间 05:00 / 10:00 / 15:00 / 20:00 / 01:00 提醒
# GitHub Actions 的 cron 使用 UTC，北京时间 = UTC + 8，故换算为 UTC 的 21/02/07/12/17 点
on:
  schedule:
    - cron: '0 2,7,12,17,21 * * *'
  workflow_dispatch: {}   # 也支持在 Actions 页面手动触发，方便测试

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 发送报时提醒
        uses: actions/github-script@v7
        with:
          script: |
            // 计算北京时间（UTC+8）
            const now = new Date(Date.now() + 8 * 60 * 60 * 1000);
            const pad = (n) => String(n).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${now.getUTCFullYear()}-${pad(now.getUTCMonth() + 1)}-${pad(now.getUTCDate())}`;
            const timeStr = `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}`;
            const weekday = weekdays[now.getUTCDay()];
            const body = `你好，现在是北京时间 ${dateStr}（${weekday}）${timeStr}。`;

            const { owner, repo } = context.repo;
            const title = '⏰ 定时报时提醒';

            // 查找已存在的报时 Issue（带 time-reminder 标签），有就评论，没有就新建
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'time-reminder',
              per_page: 1,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.data[0].number,
                body,
              });
              console.log(`已在 Issue #${existing.data[0].number} 评论：${body}`);
            } else {
              // 确保标签存在
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'time-reminder' });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: 'time-reminder',
                  color: '0E8A16',
                  description: '定时报时提醒',
                });
              }
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: `这个 Issue 用于接收定时报时提醒，每次提醒会作为评论追加在下方。\n\n${body}`,
                labels: ['time-reminder'],
              });
              console.log(`已创建 Issue #${created.data.number}：${body}`);
            }
